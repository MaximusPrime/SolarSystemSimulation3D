<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SolarSystemSimulation3D - Lively</title>
    <style>
        :root {
            --primary-glow: #4facfe;
            --secondary-glow: #667eea;
            --accent-gold: #ffc864;
            --panel-opacity: 0.85;
            --bg-dark: rgba(5, 10, 25, var(--panel-opacity));
            --bg-glass: rgba(10, 20, 40, 0.75);
            --border-glow: rgba(79, 172, 254, 0.35);
            --text-primary: #e8f4ff;
            --text-secondary: #8899aa;
            --font-display: 'Outfit', 'Segoe UI', sans-serif;
            --font-body: 'Outfit', 'Segoe UI', sans-serif;
        }
        body { margin: 0; overflow: hidden; background: #000; font-family: var(--font-body); color: var(--text-primary); }
        #ui-container { position: fixed; top: 20px; left: 20px; width: 240px; background: var(--bg-dark); border: 1px solid var(--border-glow); border-radius: 16px; padding: 16px; backdrop-filter: blur(12px); transition: left 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 100; }
        #ui-container:not(.active) { left: -280px; }
        #menu-toggle-btn { position: fixed; top: 20px; left: 20px; width: 40px; height: 40px; border-radius: 50%; background: var(--bg-dark); border: 1px solid var(--border-glow); color: var(--text-primary); font-size: 18px; cursor: pointer; z-index: 101; transition: all 0.3s; backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; }
        #menu-toggle-btn:hover { background: rgba(79, 172, 254, 0.2); border-color: var(--primary-glow); }
        #menu-toggle-btn.active { left: 260px; }
        #panel-title { text-align: center; font-size: 14px; font-weight: 700; letter-spacing: 2px; color: var(--primary-glow); margin-bottom: 14px; text-transform: uppercase; }
        #ui-container button { width: 100%; padding: 10px 12px; margin-bottom: 8px; border: 1px solid var(--border-glow); border-radius: 10px; background: rgba(79, 172, 254, 0.08); color: var(--text-primary); font-size: 11px; font-weight: 600; letter-spacing: 1px; cursor: pointer; transition: all 0.3s; text-transform: uppercase; }
        #ui-container button:hover { background: rgba(79, 172, 254, 0.18); border-color: var(--primary-glow); box-shadow: 0 0 12px rgba(79, 172, 254, 0.2); }
        #ui-container button.active { background: rgba(79, 172, 254, 0.25); border-color: var(--primary-glow); color: #fff; }
        .slider-container { margin-bottom: 10px; }
        .slider-container label { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-secondary); letter-spacing: 1px; margin-bottom: 4px; text-transform: uppercase; }
        .slider-container input[type="range"] { width: 100%; height: 4px; -webkit-appearance: none; background: linear-gradient(90deg, var(--primary-glow), var(--secondary-glow)); border-radius: 2px; outline: none; }
        .slider-container input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--primary-glow); cursor: pointer; box-shadow: 0 0 8px rgba(79, 172, 254, 0.5); }
        .help-panel { margin-top: 12px; padding: 12px; background: rgba(0, 0, 0, 0.3); border-radius: 10px; border: 1px solid rgba(79, 172, 254, 0.15); }
        .help-panel-title { font-size: 12px; font-weight: 700; color: var(--primary-glow); margin-bottom: 10px; text-align: center; letter-spacing: 1px; }
        .help-item { padding: 6px 0; border-bottom: 1px solid rgba(79, 172, 254, 0.1); }
        .help-item:last-child { border-bottom: none; }
        .help-action { font-size: 10px; font-weight: 700; color: var(--text-primary); letter-spacing: 0.5px; }
        .help-desc { font-size: 9px; color: var(--text-secondary); margin-top: 2px; }
        #info-panel { position: fixed; top: 20px; right: -420px; width: 320px; max-height: calc(100vh - 40px); overflow-y: auto; background: var(--bg-dark); border: 1px solid var(--border-glow); border-radius: 16px; padding: 20px; backdrop-filter: blur(12px); transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 100; }
        #info-panel.active { right: 20px; }
        .info-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .info-header h2 { margin: 0; font-size: 20px; font-weight: 700; color: var(--primary-glow); }
        #close-btn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border-glow); background: rgba(79, 172, 254, 0.1); color: var(--text-primary); font-size: 16px; cursor: pointer; transition: all 0.3s; }
        #close-btn:hover { background: rgba(255, 100, 100, 0.2); border-color: #ff6464; }
        .info-table { width: 100%; border-collapse: collapse; }
        .info-table tr { border-bottom: 1px solid rgba(79, 172, 254, 0.1); }
        .info-table td { padding: 8px 4px; font-size: 12px; }
        .info-table .label { color: var(--text-secondary); font-weight: 600; width: 40%; }
        .info-table .value { color: var(--text-primary); }
        .info-description { margin-top: 12px; font-size: 12px; line-height: 1.6; color: var(--text-secondary); }
        .info-funfact { margin-top: 12px; padding: 10px; background: rgba(255, 200, 100, 0.08); border: 1px solid rgba(255, 200, 100, 0.2); border-radius: 8px; font-size: 11px; color: var(--accent-gold); }
        #langBtn { margin-top: 12px; }
    </style>
</head>
<body>
    <button id="menu-toggle-btn" class="active">✕</button>
    <div id="ui-container" class="active">
        <div id="panel-title">◆ CONTROL CENTER</div>
        <button id="lockBtn" class="unlocked">Interaction: Open 🔓</button>
        <button id="pauseBtn">Pause ⏸️</button>
        <button id="scaleBtn">Realistic Scale: Off 🔘</button>
        <button id="orbitBtn">Orbits: Hidden 👁️‍🗨️</button>
        <div class="slider-container">
            <label id="lblSpeed">SPEED MULTIPLIER <span id="speedValue">1x</span></label>
            <input type="range" id="speedSlider" min="0" max="3" step="0.1" value="1">
        </div>
        <div class="slider-container">
            <label id="lblOpacity">OPACITY <span id="opacityValue">85%</span></label>
            <input type="range" id="opacitySlider" min="10" max="100" step="5" value="85">
        </div>
        <div class="help-panel">
            <div class="help-panel-title">🎮 Controls</div>
            <div class="help-item">
                <div class="help-content">
                    <div class="help-action">LEFT CLICK</div>
                    <div class="help-desc">View planet information</div>
                </div>
            </div>
            <div class="help-item">
                <div class="help-content">
                    <div class="help-action">MIDDLE CLICK</div>
                    <div class="help-desc">Focus on planet</div>
                </div>
            </div>
            <div class="help-item">
                <div class="help-content">
                    <div class="help-action">LEFT CLICK DRAG</div>
                    <div class="help-desc">Rotate universe (When unlocked)</div>
                </div>
            </div>
        </div>
        <button id="langBtn">🌐 Türkçe 🇹🇷</button>
    </div>

    <div id="info-panel">
        <div class="info-header">
            <button id="close-btn">×</button>
            <h2 id="planet-name">Gezegen</h2>
        </div>
        <div id="planet-details"></div>
    </div>

    <script type="module" src="./main.js"></script>
</body>
</html>
